# ============================================================================
# Base configuration — shared across all environments.
# Environment-specific overrides live in application-{local,test,staging,prod}.
# No secrets here: credentials and client ids/secrets come from env vars,
# with safe defaults only in the `local` profile (ADR-0013).
# `local` is the default when no profile is set; override with SPRING_PROFILES_ACTIVE.
# ============================================================================
spring.profiles.default=local
spring.application.name=expense-manager

server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# --- Observability: request correlation id (ADR-0013, Phase 0.5) ---
# RequestCorrelationFilter stamps a per-request id into the MDC under `requestId`.
# This surfaces it in the human-readable console pattern (`local`); the ecs
# structured output (staging/prod) includes MDC entries automatically and ignores
# this pattern. `%X{requestId:-}` prints an empty slot for non-request threads
# (startup, scheduled work, @Push websocket threads — see F-005).
logging.pattern.correlation=[%X{requestId:-}]

# --- Vaadin ---
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.vaadin.expensemanager

# --- Persistence (ADR-0003, ADR-0004, ADR-0005) ---
# Flyway owns the schema; Hibernate validates against it, never generates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Actuator / observability (ADR-0013) ---
# Health with liveness/readiness probes for Docker healthchecks and blue-green cutover.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Admin seed identity (consumed by the Phase 1.5 seed) ---
# Value supplied per environment via ADMIN_EMAIL; safe default only in `local`.
app.admin.email=${ADMIN_EMAIL}
