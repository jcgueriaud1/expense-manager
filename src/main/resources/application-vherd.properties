# ============================================================================
# vherd profile — deployed on V-Herd at https://v-herd.eu/expense-manager/
# (Kubernetes, external Postgres, real Google OAuth, structured JSON logging).
#
# Google-backed login (ADR-0007), like staging/prod, but served under the
# `/expense-manager` sub-path. V-Herd forwards the full public path through to
# the container, so the app runs with a matching servlet context path and trusts
# the proxy's X-Forwarded-* headers to reconstruct the public https origin.
# ============================================================================

# --- Sub-path deployment (see Vaadin reverse-proxy guidance) ---
# The app serves under /expense-manager because V-Herd passes the full path
# through unchanged; `native` makes Spring honour X-Forwarded-Proto/Host so it
# builds https://v-herd.eu/... absolute URLs (cookies, post-login redirects).
# server.servlet.context-path=/expense-manager
# server.forward-headers-strategy=native

# --- Datasource (external managed Postgres, k8s service) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-service:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}

# --- Google OAuth2 (ADR-0007) ---
# Client id/secret come from env vars (no defaults — a missing var is a hard
# startup failure, never a silent insecure fallback, ADR-0013).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Pin the callback to the public sub-path URL so the redirect_uri sent to Google
# is correct regardless of which X-Forwarded-* headers the proxy sets. This exact
# value must be registered as an Authorized redirect URI in the Google client.
spring.security.oauth2.client.registration.google.redirect-uri=https://v-herd.eu/expense-manager/login/oauth2/code/google

# --- Admin seed identity (ADR-0007) ---
# Seeds the bootstrap ADMIN row (sub null) so the first Google login by this
# address claims it and keeps ADMIN. Override with ADMIN_EMAIL if needed.
app.admin.email=${ADMIN_EMAIL:jean-christophe@vaadin.com}

# --- Observability: structured JSON logging (ADR-0013) ---
logging.structured.format.console=ecs

# Docker Compose support is dev-only; never active here.
spring.docker.compose.enabled=false
