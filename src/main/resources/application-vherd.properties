# ============================================================================
# vherd profile — deployed on V-Herd at https://v-herd.eu/expense-manager/
# (Kubernetes, external Postgres, real Google OAuth, structured JSON logging).
#
# Google-backed login (ADR-0007), like staging/prod, served under the public
# `/expense-manager` sub-path. V-Herd strips that prefix before forwarding, so
# the container receives requests at the root path (verified: the app serves the
# login page with no servlet context-path set). `native` makes Spring honour the
# proxy's X-Forwarded-Proto/Host so it reconstructs the public https origin.
# ============================================================================

# --- Sub-path deployment (see Vaadin reverse-proxy guidance) ---
# No context-path: V-Herd strips /expense-manager, so the app runs at root and
# the OAuth callback arrives at /login/oauth2/code/google (matches Spring's
# filter). The redirect_uri sent to Google is pinned below to the public sub-path
# URL, so it is correct regardless of the internal request URL. `native` lets
# Spring build https://v-herd.eu/... absolute URLs (cookies, post-login redirect).
server.forward-headers-strategy=native
# Public sub-path prefix for browser-facing links (e.g. the Google authorize link
# in LoginView). NOT the servlet context-path (the container runs at root); this
# is only the prefix V-Herd adds in the public URL. Empty elsewhere (root deploys).
app.public-base-path=/expense-manager

# --- Datasource (external managed Postgres, k8s service) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-service:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}

# --- Google OAuth2 (ADR-0007) ---
# Client id/secret come from env vars (no defaults — a missing var is a hard
# startup failure, never a silent insecure fallback, ADR-0013). Both MUST be set
# in the Shepherd deployment env.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Pin the callback to the public sub-path URL so the redirect_uri sent to Google
# (both the authorize request and the token exchange) is correct regardless of the
# internal request URL. This exact value MUST be registered as an Authorized
# redirect URI in the Google OAuth client.
spring.security.oauth2.client.registration.google.redirect-uri=https://v-herd.eu/expense-manager/login/oauth2/code/google

# --- Admin seed identity (ADR-0007) ---
# Seeds the bootstrap ADMIN row (sub null) so the first Google login by this
# address claims it and keeps ADMIN. Override with ADMIN_EMAIL if needed.
app.admin.email=${ADMIN_EMAIL:jean-christophe@vaadin.com}

# --- Observability: structured JSON logging (ADR-0013) ---
logging.structured.format.console=ecs

# Docker Compose support is dev-only; never active here.
spring.docker.compose.enabled=false
