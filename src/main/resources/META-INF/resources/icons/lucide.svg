<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lucide icon sprite — the app's icon set (ADR-0026).

  Glyphs from Lucide (https://lucide.dev), ISC licence, vendored verbatim from
  https://github.com/lucide-icons/lucide/tree/main/icons. The licence text is
  beside this file in LICENSE.lucide; keep it there, it is the attribution.

  DO NOT hand-edit a path. To add a glyph, drop the upstream file in and rebuild
  this sprite — the paths must stay byte-identical to upstream so an upgrade is a
  diff and not an archaeology exercise.

  Every <symbol> carries its own fill/stroke attributes, and that is load-bearing.
  Addressed through `symbol`, vaadin-icon renders <use href="…#id"/> against the
  external file and never fetches it, so it reads no attribute off this root <svg>
  and applies none to the <svg> it renders (vaadin-icon-mixin __srcChanged, and
  see F-075). Attributes here on the root would be silently ignored.

  `stroke="currentColor"` is what makes an icon take its parent's text colour, in
  both colour schemes. It resolves against the <use> element's context, which is
  why it survives the external reference.

  NO <symbol> MAY DECLARE stroke-width. That one attribute is deliberately absent so
  the theme's vaadin-icon-stroke-width custom property can reach the glyph: an
  element's own presentation attribute beats an inherited value at any specificity, so
  a stroke-width here would silently make that property inert (F-072's mechanism, one
  layer down). The width is set once, in aura-theme.css. Re-add it here and the theme
  knob dies quietly; LucideIconTest fails if you do.

  Mind the prose in this comment: an XML comment may not contain a double hyphen, so
  custom properties are named here WITHOUT their leading dashes. Write them in full and
  this file stops being well-formed XML, every external <use> resolves to nothing, and
  every icon in the app disappears with no console error at all (F-076).
-->
