# ============================================================================
# test profile — Testcontainers Postgres (ADR-0004, ADR-0012).
#
# The datasource is supplied at runtime by a Testcontainers @ServiceConnection
# in the integration-test base class (harness wired in Phase 0.9); no static
# JDBC URL is configured here. spring-boot-docker-compose is skipped in tests
# by default, so the local Compose service does not start.
# ============================================================================

# Deterministic, non-production seed identity for tests.
app.admin.email=${ADMIN_EMAIL:admin@vaadin.com}

# Form-stub login (ADR-0012): deterministic dev password for the test accounts.
app.security.dev-login.password=${DEV_LOGIN_PASSWORD:test-password}

# Each @SpringBootTest class caches its own Spring context, and each context holds
# its own Hikari pool against the single reused Testcontainers Postgres. With the
# default pool size (10) the aggregate across a dozen-plus contexts exceeds
# Postgres's default max_connections (100) and later contexts fail to start with
# "FATAL: sorry, too many clients already". The tests are single-threaded, so a
# small pool per context is ample and keeps the total well under the limit.
spring.datasource.hikari.maximum-pool-size=4
