# ============================================================================
# local profile (default) — Docker Compose Postgres, safe secret defaults.
#
# `./mvnw` auto-starts the `compose.yaml` Postgres service (spring-boot-docker-compose)
# and wires the datasource from it — no manual DB setup. The properties below are
# fallbacks/documentation and apply when Compose is not used (e.g. pointing at an
# already-running DB). All secrets have safe non-production defaults here ONLY.
# ============================================================================

# --- Datasource (defaults match compose.yaml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_manager}
spring.datasource.username=${DB_USERNAME:expense}
spring.datasource.password=${DB_PASSWORD:expense}

# --- Google OAuth2 (real login wires in Phase 1.2; local uses a form-stub in 1.3) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-client-secret}

# --- Admin seed identity ---
app.admin.email=${ADMIN_EMAIL:jean-christophe@vaadin.com}

# Human-readable logs in local (structured JSON is staging/prod only, ADR-0013).
