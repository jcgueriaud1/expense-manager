# ============================================================================
# prod profile — same shape as staging (external managed Postgres, real Google
# OAuth, no seed data, structured JSON logging). All secrets from env vars with
# NO defaults; a missing var is a hard startup failure (ADR-0013).
# ============================================================================

# --- Datasource (external managed Postgres) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Google OAuth2 (ADR-0007) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- Admin seed identity ---
app.admin.email=${ADMIN_EMAIL}

# --- Observability: structured JSON logging (ADR-0013) ---
logging.structured.format.console=ecs

# Docker Compose support is dev-only; never active here.
spring.docker.compose.enabled=false
