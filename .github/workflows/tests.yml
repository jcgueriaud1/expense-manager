name: Tests

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # Testcontainers spins up postgres:17-alpine via the Docker daemon,
      # which is preinstalled on ubuntu-latest runners (AbstractIntegrationTest).
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
